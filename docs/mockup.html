<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾光手办 · 视觉预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

  :root {
    --ink: #1A1A24;
    --ink2: #4A4A5A;
    --sub: #8A8A9E;
    --line: #EDEDF2;
    --bg: #F5F5F7;
    --brand: #FF5C39;
    --brand-soft: #FFF0EC;
    --gold: #C9A227;
    --gold-soft: #FBF6E6;
    --white: #FFFFFF;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #101014;
    color: #E8E8F0;
    min-height: 100vh;
    padding: 40px 24px 64px;
  }

  .head {
    max-width: 1240px;
    margin: 0 auto 36px;
    text-align: center;
  }
  .head h1 {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 2px;
  }
  .head p {
    margin-top: 10px;
    font-size: 13px;
    color: #7C7C92;
    letter-spacing: 1px;
  }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 36px;
  }
  .tab {
    padding: 9px 20px;
    border-radius: 20px;
    border: 1px solid #2A2A34;
    background: #17171C;
    color: #9A9AB0;
    font-size: 13px;
    cursor: pointer;
    transition: all .18s ease;
  }
  .tab:hover { border-color: #3A3A48; color: #D0D0E0; }
  .tab.on {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
    font-weight: 500;
  }

  .stage {
    display: flex;
    gap: 48px;
    max-width: 1240px;
    margin: 0 auto;
    justify-content: center;
    align-items: flex-start;
  }

  /* ---------- 手机外框 ---------- */
  .device {
    width: 390px;
    flex-shrink: 0;
    background: #000;
    border-radius: 44px;
    padding: 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px #2A2A34;
    position: relative;
  }
  .device::after {
    content: '';
    position: absolute;
    top: 18px; left: 50%;
    transform: translateX(-50%);
    width: 108px; height: 26px;
    background: #000;
    border-radius: 0 0 16px 16px;
    z-index: 30;
  }
  .viewport {
    width: 370px;
    height: 780px;
    background: var(--bg);
    border-radius: 36px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* 状态栏 */
  .statusbar {
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    background: #fff;
    z-index: 20;
  }
  .statusbar.light { background: transparent; color: #fff; position: absolute; left: 0; right: 0; top: 0; }
  .statusbar .dots { display: flex; gap: 3px; align-items: center; }
  .statusbar .dot { width: 3px; height: 3px; border-radius: 50%; background: currentColor; }

  /* 导航栏 */
  .navbar {
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    position: relative;
    z-index: 15;
  }
  .navbar .back {
    position: absolute;
    left: 16px;
    font-size: 20px;
    color: var(--ink);
    font-weight: 400;
  }

  .scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .scroll::-webkit-scrollbar { width: 0; }

  /* ---------- 通用 ---------- */
  .card { background: #fff; border-radius: 16px; }
  .pad { padding: 12px; }

  .art {
    position: relative;
    overflow: hidden;
    background: #EFEFF4;
  }
  .art::before {
    content: '';
    position: absolute;
    left: 50%; top: 22%;
    transform: translateX(-50%);
    width: 34%; height: 26%;
    border-radius: 50%;
    background: rgba(255,255,255,.5);
  }
  .art::after {
    content: '';
    position: absolute;
    left: 50%; bottom: 16%;
    transform: translateX(-50%);
    width: 46%; height: 34%;
    background: rgba(255,255,255,.4);
    clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%);
  }
  .art-1 { background: linear-gradient(150deg, #FFC4A3, #FF5C39); }
  .art-2 { background: linear-gradient(150deg, #A8B8FF, #3F2B96); }
  .art-3 { background: linear-gradient(150deg, #E4C96B, #8A6D1F); }
  .art-4 { background: linear-gradient(150deg, #9BE0DA, #1A4A5A); }
  .art-5 { background: linear-gradient(150deg, #E0B4B4, #7A3B3B); }
  .art-6 { background: linear-gradient(150deg, #C8C8D8, #4A4A5A); }
  .art-7 { background: linear-gradient(150deg, #B7A8F0, #4B2E83); }
  .art-8 { background: linear-gradient(150deg, #F0C4A0, #8A4B1F); }

  .price { color: var(--brand); font-weight: 600; font-family: "DIN Alternate", "Helvetica Neue", sans-serif; }
  .price .sym { font-size: 11px; }
  .price .num { font-size: 17px; }

  /* ---------- 首页 ---------- */
  .search { padding: 8px 12px 4px; }
  .search-box {
    height: 36px; border-radius: 18px; background: #fff;
    display: flex; align-items: center; padding: 0 12px;
    font-size: 12px; color: #A8A8B8;
  }
  .search-box span:first-child { font-size: 15px; margin-right: 6px; color: var(--sub); }

  .banner {
    margin: 6px 12px 0;
    height: 200px;
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(120deg, #2B2340 0%, #6B3A8F 55%, #A8456B 100%);
  }
  .banner .art-sil {
    position: absolute; right: 24px; top: 30px;
    width: 120px; height: 150px;
    background: rgba(255,255,255,.13);
    clip-path: polygon(50% 0, 78% 18%, 70% 100%, 30% 100%, 22% 18%);
  }
  .banner .txt {
    position: absolute; left: 18px; bottom: 18px;
  }
  .banner .t1 { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; }
  .banner .t2 { margin-top: 4px; font-size: 11px; color: rgba(255,255,255,.7); }
  .banner .pager {
    position: absolute; bottom: 12px; right: 16px;
    display: flex; gap: 4px;
  }
  .banner .pager i { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .banner .pager i.on { width: 14px; border-radius: 3px; background: #fff; }

  .entries { display: flex; padding: 16px 8px 0; }
  .entry { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .entry .dot {
    width: 46px; height: 46px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; color: #fff;
    box-shadow: 0 4px 10px rgba(26,26,36,.14);
  }
  .entry .lb { margin-top: 7px; font-size: 11px; color: var(--ink2); }

  .sec-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 22px 12px 10px;
  }
  .sec-left { display: flex; align-items: center; }
  .sec-bar { width: 3px; height: 16px; border-radius: 2px; background: var(--brand); margin-right: 7px; }
  .sec-t { font-size: 16px; font-weight: 600; color: var(--ink); }
  .sec-s { margin-left: 8px; font-size: 10px; color: var(--sub); }
  .sec-more { font-size: 11px; color: var(--sub); }

  .hscroll { display: flex; gap: 10px; padding: 0 12px; overflow-x: auto; }
  .hscroll::-webkit-scrollbar { height: 0; }
  .hcard {
    width: 148px; flex-shrink: 0; background: #fff;
    border-radius: 12px; overflow: hidden;
  }
  .hcard .art { width: 148px; height: 148px; position: relative; }
  .hcard .badge {
    position: absolute; top: 7px; left: 7px;
    padding: 2px 7px; border-radius: 4px;
    background: var(--gold); color: #fff; font-size: 9px; font-weight: 500;
  }
  .hcard .nm { padding: 8px 9px 0; font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hcard .pr { padding: 4px 9px 9px; }

  .custom-banner {
    margin: 22px 12px 0;
    padding: 18px 16px;
    border-radius: 14px;
    background: linear-gradient(120deg, #1A1A24 0%, #33334A 100%);
    display: flex; align-items: center; justify-content: space-between;
  }
  .custom-banner .l .t { font-size: 14px; font-weight: 600; color: #fff; }
  .custom-banner .l .s { margin-top: 4px; font-size: 10px; color: rgba(255,255,255,.6); }
  .custom-banner .btn {
    padding: 7px 16px; border-radius: 18px;
    background: var(--brand); color: #fff; font-size: 11px; font-weight: 500;
  }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding: 0 12px; }
  .gcard { background: #fff; border-radius: 12px; overflow: hidden; }
  .gcard .art { width: 100%; height: 170px; }
  .gcard .body { padding: 8px 9px 11px; }
  .gcard .nm { font-size: 12px; color: var(--ink); line-height: 1.45; height: 34px; overflow: hidden; }
  .gcard .sb { margin-top: 3px; font-size: 10px; color: var(--sub); }
  .gcard .pr { margin-top: 6px; display: flex; align-items: baseline; }
  .gcard .org { margin-left: 5px; font-size: 10px; color: #B0B0BE; text-decoration: line-through; }

  .footer-tip { padding: 26px 0 18px; text-align: center; font-size: 10px; color: #B0B0BE; letter-spacing: 2px; }

  /* ---------- 底部 tabbar ---------- */
  .tabbar {
    height: 58px; flex-shrink: 0;
    background: #fff;
    border-top: 1px solid var(--line);
    display: flex;
    padding-bottom: 6px;
  }
  .tb { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  .tb .ic { font-size: 17px; color: var(--sub); line-height: 1; }
  .tb .lb { font-size: 9px; color: var(--sub); }
  .tb.on .ic, .tb.on .lb { color: var(--ink); font-weight: 600; }

  /* ---------- 详情 ---------- */
  .detail-hero { height: 370px; position: relative; }
  .detail-hero .counter {
    position: absolute; right: 12px; bottom: 12px;
    padding: 3px 9px; border-radius: 12px;
    background: rgba(26,26,36,.55); color: #fff; font-size: 10px;
  }
  .detail-hero .hint {
    position: absolute; left: 12px; bottom: 12px;
    padding: 3px 9px; border-radius: 12px;
    background: rgba(255,255,255,.86); color: var(--ink2); font-size: 9px;
  }
  .d-info { background: #fff; padding: 16px 12px 14px; margin-top: 8px; }
  .d-price { display: flex; align-items: baseline; }
  .d-price .big { font-size: 26px; font-weight: 600; color: var(--brand); font-family: "DIN Alternate", sans-serif; }
  .d-price .big .s { font-size: 14px; }
  .d-price .org { margin-left: 8px; font-size: 12px; color: #B0B0BE; text-decoration: line-through; }
  .d-price .limit {
    margin-left: 8px; padding: 2px 8px; border-radius: 4px;
    background: var(--gold-soft); color: var(--gold); font-size: 10px; font-weight: 500;
  }
  .d-title { margin-top: 10px; font-size: 17px; font-weight: 600; color: var(--ink); line-height: 1.5; }
  .d-sub { margin-top: 4px; font-size: 12px; color: var(--sub); }
  .d-meta { margin-top: 10px; display: flex; gap: 14px; font-size: 11px; color: var(--ink2); }
  .d-meta .out { color: var(--brand); }

  .d-block { background: #fff; margin-top: 8px; padding: 14px 12px; }
  .d-block .bt { font-size: 14px; font-weight: 600; color: var(--ink); }
  .specs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .spec {
    padding: 7px 16px; border-radius: 6px;
    border: 1px solid var(--line); background: #FAFAFC;
    font-size: 12px; color: var(--ink2);
  }
  .spec.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 500; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .stepper span {
    width: 32px; height: 28px; line-height: 28px; text-align: center;
    background: #FAFAFC; font-size: 14px; color: var(--ink);
  }
  .stepper b { width: 40px; height: 28px; line-height: 28px; text-align: center; font-size: 13px; font-weight: 400; }
  .row-between { display: flex; align-items: center; justify-content: space-between; }

  .rules { margin-top: 10px; }
  .rules div { font-size: 11px; color: var(--sub); line-height: 1.8; }

  .detail-bar {
    height: 60px; flex-shrink: 0; background: #fff;
    display: flex; align-items: center; padding: 0 10px;
    box-shadow: 0 -1px 8px rgba(26,26,36,.06);
  }
  .bar-icon { width: 44px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .bar-icon .s { font-size: 16px; color: var(--ink2); }
  .bar-icon .l { font-size: 9px; color: var(--sub); }
  .bar-ghost {
    flex: 1; height: 42px; margin-left: 8px; border-radius: 21px;
    border: 1px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--ink);
  }
  .bar-primary {
    flex: 1; height: 42px; margin-left: 8px; border-radius: 21px;
    background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 500;
  }

  
/* ---------- 关于 ---------- */
function pageAbout() {
  return `
  ${statusbar()}
  <div class="navbar"><span class="back">‹</span>关于</div>
  <div class="scroll">
    <div class="about-hero">
      <div class="about-hero-text">
        <div class="about-hero-title">一个人，一间工作室</div>
        <div class="about-hero-sub">从建模到涂装，每件作品都由同一个人完成</div>
      </div>
    </div>

    <div class="about-stats">
      <div class="about-stat"><div class="about-num">6<span class="about-unit">年</span></div><div class="about-label">一直在做</div></div>
      <div class="about-stat"><div class="about-num">120<span class="about-unit">+</span></div><div class="about-label">完成作品</div></div>
      <div class="about-stat"><div class="about-num">40<span class="about-unit">h</span></div><div class="about-label">平均单件工时</div></div>
    </div>

    <div class="about-block">
      <div class="about-bt">为什么做这个</div>
      <div class="about-p">最开始只是想要一个货架上买不到的模型，后来发现「做出来」这件事本身比「拥有」更有意思。现在做的每一件，都是我自己也想摆在桌上的东西。</div>
    </div>

    <div class="about-block">
      <div class="about-bt">怎么做</div>
      <div class="about-p">建模用 Blender，打印后翻模，再用树脂灌注。上色是纯手工的，一层一层叠加，有些作品要涂到第七层才出效果。所以每件的表面质感和官方量产款不一样，有手工的痕迹。</div>
      <div class="about-p">一件作品从建模到完工，平均要四十个小时。限量款的编号就是完工顺序，编号越小，做得越早，也越舍不得卖。</div>
    </div>

    <div class="about-block">
      <div class="about-bt">怎么买</div>
      <div class="about-p">目前不走线上下单，看完作品觉得喜欢，直接通过客服找我聊。可以问尺寸、问细节、问工期，也可以说说你想要什么，看看能不能做。</div>
      <div class="about-p">定制需要先确认需求和报价，双方都清楚之后再开始。定金是总价的三成，开始制作后不退——因为你的那件已经开工了，别人也不会要。</div>
    </div>

    <div class="about-tip">作品都是手工制作，有细微手工痕迹属正常工艺特征，不视为瑕疵。照片受光线影响可能与实物有轻微色差，介意的话可以先聊清楚再决定。</div>

    <div class="about-btn">联系手作人</div>

    <div class="about-footer">
      <div class="about-brand">拾光手办</div>
      <div class="about-brand-sub">SHIGUANG FIGURE</div>
    </div>
    <div style="height:24px"></div>
  </div>`
}

/* ---------- 编号查询 ---------- */
function pageVerify() {
  return `
  ${statusbar()}
  <div class="navbar"><span class="back">‹</span>编号查询</div>
  <div class="scroll">
    <div class="v-head">
      <div class="v-title">作品编号查询</div>
      <div class="v-sub">输入底座背面的编号，确认作品出处与序号</div>
    </div>

    <div class="v-panel">
      <div class="v-row">
        <input id="vInput" class="v-input" placeholder="SG-2026-0128" maxlength="16" />
        <div class="v-btn" id="vBtn">查询</div>
      </div>
      <div class="v-hint">格式为 SG 加年份加四位序号，例如 SG-2026-0128</div>
    </div>

    <div id="vResult"></div>

    <div class="v-tips">
      <div class="v-tips-t">关于编号</div>
      <div class="v-tip">· 编号刻在每件作品底座的背面</div>
      <div class="v-tip">· 序号即完工顺序，数字越小做得越早</div>
      <div class="v-tip">· 同一编号不会重复，可作为流通时的出处凭证</div>
      <div class="v-tip">· 查询在本地完成，不会上传你的输入</div>
    </div>
    <div style="height:24px"></div>
  </div>`
}

/* ---------- 浏览历史 ---------- */
function pageHistory() {
  const items = [
    ['art-2', '机械螳螂 1/6 收藏级手办', '¥598.00', '刚刚'],
    ['art-1', '原创 · 雾都游侠 1/7 手办', '¥268.00', '2 小时前'],
    ['art-4', '和风 · 樱守 1/7', '¥398.00', '1 天前'],
    ['art-3', '深海档案馆 1/8', '¥368.00', '3 天前']
  ]
  return `
  ${statusbar()}
  <div class="navbar"><span class="back">‹</span>浏览历史</div>
  <div class="scroll">
    <div class="h-head"><span>共 ${items.length} 件</span><span class="h-clear">清空</span></div>
    <div class="h-list">
      ${items.map(([art, name, price, time]) => `
        <div class="h-item">
          <div class="art ${art} h-img"></div>
          <div class="h-body"><div class="h-name">${name}</div><div class="h-price">${price}</div></div>
          <div class="h-time">${time}</div>
        </div>`).join('')}
    </div>
    <div style="height:24px"></div>
  </div>`
}

/* ---------- 购物车 ---------- */
  .cart-head { display: flex; justify-content: space-between; padding: 12px 12px 4px; font-size: 11px; color: var(--sub); }
  .cart-head .m { color: var(--ink); }
  .cart-item {
    display: flex; align-items: center; gap: 9px;
    background: #fff; border-radius: 12px; padding: 11px 10px;
    margin: 0 10px 8px;
  }
  .check {
    width: 19px; height: 19px; border-radius: 50%;
    border: 1px solid #D9D9E0; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #fff;
  }
  .check.on { background: var(--brand); border-color: var(--brand); }
  .cart-item .art { width: 78px; height: 78px; border-radius: 8px; flex-shrink: 0; }
  .cart-item .body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; height: 78px; }
  .cart-item .nm { font-size: 12px; color: var(--ink); font-weight: 500; line-height: 1.4; }
  .cart-item .sp { font-size: 10px; color: var(--sub); }
  .cart-item .foot { display: flex; align-items: center; justify-content: space-between; }

  .settle {
    height: 62px; flex-shrink: 0; background: #fff;
    display: flex; align-items: center; padding: 0 12px;
    box-shadow: 0 -1px 8px rgba(26,26,36,.06);
  }
  .settle .all { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--ink2); }
  .settle .sum { flex: 1; text-align: right; padding-right: 10px; }
  .settle .sum .l { font-size: 10px; color: var(--sub); margin-right: 4px; }
  .settle .sum .v { font-size: 19px; font-weight: 600; color: var(--brand); font-family: "DIN Alternate", sans-serif; }
  .settle .go {
    width: 110px; height: 40px; border-radius: 20px;
    background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 500;
  }

  /* ---------- 订单确认 ---------- */
  .addr {
    margin: 10px 12px 0; background: #fff; border-radius: 12px;
    padding: 14px 12px; display: flex; align-items: center; justify-content: space-between;
  }
  .addr .n { font-size: 14px; font-weight: 600; color: var(--ink); }
  .addr .p { margin-left: 10px; font-size: 12px; color: var(--sub); }

/* ---------- 切换 ---------- */
const PAGES = {
  home: pageHome,
  detail: pageDetail,
  cart: pageCart,
  confirm: pageConfirm,
  user: pageUser,
  admin: pageAdmin,
  about: pageAbout,
  verify: pageVerify,
  history: pageHistory
}

function render(page) {
  const screen = document.getElementById('screen')
  screen.innerHTML = PAGES[page]()
  screen.scrollTop = 0

  if (page === 'detail') setTimeout(initCompare, 0)
  if (page === 'verify') setTimeout(initVerify, 0)

  const note = NOTES[page] || { title: '', sub: '', items: [] }
  document.getElementById('notes').innerHTML = `
    <h2>${note.title}</h2>
    <p class="sub">${note.sub}</p>
    ${note.items.map(([k, v]) => `
      <div class="note-item">
        <div class="k">${k}</div>
        <div class="v">${v}</div>
      </div>`).join('')}
  `
}


/* ---------- 交互初始化 ---------- */

/** 上色对比：拖动分割线 */
function initCompare() {
  const box = document.getElementById('cmpBox')
  const before = document.getElementById('cmpBefore')
  const line = document.getElementById('cmpLine')
  if (!box || !before || !line) return

  let dragging = false

  const move = (clientX) => {
    const rect = box.getBoundingClientRect()
    let pct = ((clientX - rect.left) / rect.width) * 100
    pct = Math.max(3, Math.min(97, pct))
    before.style.width = pct + '%'
    line.style.left = pct + '%'
  }

  box.addEventListener('mousedown', (e) => { dragging = true; move(e.clientX); e.preventDefault() })
  window.addEventListener('mousemove', (e) => { if (dragging) move(e.clientX) })
  window.addEventListener('mouseup', () => { dragging = false })

  box.addEventListener('touchstart', (e) => { move(e.touches[0].clientX) }, { passive: true })
  box.addEventListener('touchmove', (e) => { move(e.touches[0].clientX) }, { passive: true })
}

/** 编号查询：本地校验 */
function initVerify() {
  const input = document.getElementById('vInput')
  const btn = document.getElementById('vBtn')
  const out = document.getElementById('vResult')
  if (!input || !btn || !out) return

  const run = () => {
    const raw = String(input.value || '').trim().toUpperCase().replace(/[\s\-_]/g, '')
    if (!raw) return

    const m = /^SG(\d{4})(\d{4})$/.exec(raw)
    let html = ''

    if (!m) {
      html = `<div class="v-res"><div class="v-badge fail">!</div><div class="v-rt">未通过验证</div><div class="v-rs">编号格式不正确，应为 SG-年份-四位序号</div></div>`
    } else {
      const year = Number(m[1])
      const seqStr = m[2]
      const head = Number(seqStr.slice(0, 3))
      const check = Number(seqStr.slice(3))
      const expect = ((year % 100) + head) % 10

      if (year < 2024 || year > 2035) {
        html = `<div class="v-res"><div class="v-badge fail">!</div><div class="v-rt">未通过验证</div><div class="v-rs">编号中的年份不在有效范围内</div></div>`
      } else if (check !== expect) {
        html = `<div class="v-res"><div class="v-badge fail">!</div><div class="v-rt">未通过验证</div><div class="v-rs">该编号不存在，请核对底座上的数字</div></div>`
      } else {
        html = `<div class="v-res">
          <div class="v-badge ok">✓</div>
          <div class="v-rt">编号有效</div>
          <div class="v-rs">这是 ${year} 年出品的第 ${head} 件作品</div>
          <div class="v-detail">
            <div class="v-drow"><span class="v-dk">出品年份</span><span class="v-dv">${year} 年</span></div>
            <div class="v-drow"><span class="v-dk">作品序位</span><span class="v-dv">第 ${head} 件</span></div>
            <div class="v-drow"><span class="v-dk">完整编号</span><span class="v-dv">SG-${year}-${seqStr}</span></div>
          </div>
        </div>`
      }
    }
    out.innerHTML = html
  }

  btn.addEventListener('click', run)
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') run() })
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab')
  if (!tab) return
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'))
  tab.classList.add('on')
  render(tab.dataset.page)
})

render('home')
</script>
